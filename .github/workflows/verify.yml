name: Verify xyquant
on:
  pull_request:
  push:
    branches: [main, feature/direct-mcp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install business skill runtime
        run: python -m pip install -r plugins/xyquant/skills/factor-rankic/requirements.txt -r plugins/xyquant/skills/factor-synthesis/requirements.txt -r plugins/xyquant/skills/portfolio-attribution/requirements.txt -r plugins/xyquant/skills/stock-holding-diagnosis/requirements.txt -r plugins/xyquant/skills/ipo-return-calculator/requirements.txt
      - name: Verify plugin and local workflows
        run: python -B -m unittest discover -s tests
      - name: Verify attribution workflows
        run: python -B -m unittest discover -s plugins/xyquant/skills/portfolio-attribution/tests
      - name: Build portable package
        run: python scripts/package.py
      - name: Upload plugin
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xyquant
          path: dist/
          if-no-files-found: error
